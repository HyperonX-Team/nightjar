name: nightjar
description: Nightjar. Android only.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.0.0
  crypto: ^3.0.3
  firebase_auth: ^5.0.0
  firebase_core: ^3.0.0
  firebase_storage: ^12.0.0
  flutter_foreground_task: ^8.10.0
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.1
  package_info_plus: ^8.0.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  phone_numbers_parser: ^9.0.0
  # Android only: the umbrella `record` package pulls in record_linux, which
  # does not compile against the current platform interface. The page never
  # needs the desktop implementations.
  record_android: ^1.5.2
  record_platform_interface: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
